name: Verify OpenAI model and Week 3 live repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify OpenAI key and gpt-6-luna
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_KEY:-}" ]]; then
            echo "secret_present=false"
            exit 2
          fi
          echo "secret_present=true"
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ["OPENAI_KEY"]
          request = urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization": f"Bearer {key}"},
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"http_status={error.code}")
              print("model_present=false")
              sys.exit(3)

          ids = {item.get("id") for item in payload.get("data", [])}
          present = "gpt-6-luna" in ids
          print(f"http_status={status}")
          print(f"model_present={'true' if present else 'false'}")
          if not present:
              sys.exit(4)
          PY

      - name: Check out accesswright
        uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run bounded Week 3 live semantic repair
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ACCESSWRIGHT_LIVE_LLM: "1"
          ACCESSWRIGHT_LIVE_MODEL: "gpt-6-luna"
          ACCESSWRIGHT_LIVE_INPUT_USD_PER_MILLION: "0.10"
          ACCESSWRIGHT_LIVE_OUTPUT_USD_PER_MILLION: "0.50"
          ACCESSWRIGHT_LIVE_MAX_COST_USD: "0.01"
          ACCESSWRIGHT_LIVE_MAX_OUTPUT_TOKENS: "3000"
          ACCESSWRIGHT_LIVE_RUN_RECORD: "live-run.jsonl"
        run: npx vitest --run test/llm/live-openai.test.ts
